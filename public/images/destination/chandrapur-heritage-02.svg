<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
  <defs>
    <radialGradient id="skyG" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#26201a"/>
      <stop offset="50%" stop-color="#18130e"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </radialGradient>
    <linearGradient id="goldM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b874" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#c5a059" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8c734b" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="mist" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0a0908" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0908" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunOrb" cx="50%" cy="35%" r="30%">
      <stop offset="0%" stop-color="#c49a58" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c49a58" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="100%" height="100%" fill="url(#skyG)"/>
  <circle cx="1920" cy="750" r="750" fill="url(#sunOrb)"/>

  <!-- Distant Hill Ridge Layer 1 -->
  <path d="M 0 1320 Q 600 1180 1200 1260 T 2400 1210 T 3840 1300 L 3840 2160 L 0 2160 Z" fill="#14120f" opacity="0.8"/>

  <!-- Forest Canopy Ridge Layer 2 -->
  <path d="M 0 1480 Q 480 1380 960 1440 T 1920 1370 T 2880 1430 T 3840 1400 L 3840 2160 L 0 2160 Z" fill="#100e0c" opacity="0.92"/>

  <!-- Teak Woodland Tree Silhouettes Across Horizon -->
  <g fill="#080706" opacity="0.98">
    <path d="M 180 1520 C 160 1370 240 1350 270 1410 C 310 1320 400 1340 430 1440 C 470 1390 540 1420 560 1530 Z"/>
    <path d="M 720 1500 C 700 1340 820 1320 860 1390 C 910 1290 1020 1300 1060 1420 C 1120 1360 1200 1400 1230 1520 Z"/>
    <path d="M 1520 1490 C 1500 1310 1620 1290 1680 1370 C 1730 1260 1880 1270 1930 1400 C 1990 1340 2100 1370 2140 1510 Z"/>
    <path d="M 2420 1500 C 2400 1340 2520 1310 2570 1390 C 2630 1280 2760 1290 2810 1410 C 2880 1350 2980 1390 3020 1520 Z"/>
    <path d="M 3220 1510 C 3200 1350 3320 1330 3370 1400 C 3430 1300 3560 1310 3610 1430 C 3680 1370 3790 1400 3830 1530 Z"/>
  </g>

  <!-- Foreground Atmospheric Mist and Ground -->
  <rect y="1560" width="3840" height="600" fill="url(#mist)"/>
  <rect y="1880" width="3840" height="280" fill="#060504"/>

  <!-- Architectural Frame (Completely Clean - No Text, No Logos) -->
  <rect x="48" y="48" width="3744" height="2064" fill="none" stroke="url(#goldM)" stroke-width="1.5"/>
  <rect x="72" y="72" width="3696" height="2016" fill="none" stroke="#1c1914" stroke-width="1"/>
</svg>